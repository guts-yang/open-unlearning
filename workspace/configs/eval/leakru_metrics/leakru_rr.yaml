# @package eval.leakru.metrics.leakru_rr
defaults:
  - ../../leakru_datasets@datasets: leakru_mquake
  - ../../collator@collators: DataCollatorForSupervisedDatasetwithIndex
  - ../../generation@generation_args: default

reference_logs:
  pretrained_model_logs:
    path: ${eval.leakru.pretrained_logs_path}
    include:
      leakru_acc:
        access_key: pretrained

handler: leakru_rr
batch_size: ${eval.leakru.batch_size}

datasets:
  LeakRU_QA_mquake:
    args:
      data_path: ${eval.leakru.data_path}
      subset: ${eval.leakru.subset}
      per_type_limit: ${eval.leakru.per_type_limit}
      predict_with_generate: true
collators:
  DataCollatorForSupervisedDataset:
    args:
      padding_side: left
