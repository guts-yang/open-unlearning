# @package _global_
# LeakRU-only eval (no TOFU/MUSE). For loader/schema checks and remote LeakRU-only runs.

defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /eval: leakru

model:
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-3.2-1B-Instruct_full

eval:
  leakru:
    pretrained_logs_path: null
    per_type_limit: 20
    subset: mquake
    overwrite: true

task_name: leakru_mquake
paths:
  output_dir: workspace/saves/eval/${task_name}
