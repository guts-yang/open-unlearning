# @package _global_
# Combined OU TOFU + LeakRU eval. Opt-in; does not replace official eval/tofu.

defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /eval: tofu_and_leakru

forget_split: forget10
holdout_split: holdout10
retain_logs_path: null

model:
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-3.2-1B-Instruct_full

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
  leakru:
    pretrained_logs_path: null
    per_type_limit: 20
    subset: mquake
    overwrite: true

task_name: tofu_leakru_mquake
paths:
  output_dir: workspace/saves/eval/${task_name}
