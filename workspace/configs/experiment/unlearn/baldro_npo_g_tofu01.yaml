# @package _global_
# NPO + BalDRO-G  TOFU forget01

defaults:
  - override /model: Llama-2-7b-chat-hf
  - override /trainer: GroupNPO
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: TOFU_QA_retain
  - override /eval: tofu

model:
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-2-7b-chat-hf_full

forget_split: forget01
retain_split: retain99
holdout_split: holdout01
retain_logs_path: null
question_key: "question"

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

trainer:
  method_args:
    beta: 0.1
    sampling_ratio: 0.5
  args:
    learning_rate: 1.0e-5
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 4
    num_train_epochs: 10
    eval_strategy: epoch
    seed: 0

task_name: baldro_npo_g_tofu01
paths:
  output_dir: workspace/saves/unlearn/${task_name}
