# @package _global_
# SimNPO + BalDRO-DV  TOFU forget05  Llama-2-7B  seed 0  beta_dv=2.0

defaults:
  - override /model: Llama-2-7b-chat-hf
  - override /trainer: DrSimNPO
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: TOFU_QA_retain
  - override /eval: tofu

model:
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-2-7b-chat-hf_full
    attn_implementation: eager
    torch_dtype: float32
  tokenizer_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-2-7b-chat-hf_full

forget_split: forget05
retain_split: retain95
holdout_split: holdout05
retain_logs_path: /root/autodl-tmp/saves/eval/tofu_Llama-2-7b-chat-hf_retain95/TOFU_EVAL.json
question_key: "question"

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

trainer:
  method_args:
    delta: 0.0
    beta: 4.5
    alpha: 1.0
    gamma: 0.125
    retain_loss_type: NLL
    forget_dro: true
    retain_dro: false
    beta_dv_forget: 2.0
    beta_dv_retain: 1.0
  args:
    learning_rate: 1.0e-5
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 4
    num_train_epochs: 10
    eval_strategy: epoch
    seed: 0
    bf16: false
    bf16_full_eval: false
    gradient_checkpointing: true

task_name: baldro_simnpo_dv_tofu05
paths:
  output_dir: workspace/saves/unlearn/${task_name}
