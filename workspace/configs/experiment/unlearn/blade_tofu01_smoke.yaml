# @package _global_
# Short-horizon smoke: TOFU 1B forget01. Not for table matching.

defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /trainer: LoRABiALAdaptive
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: TOFU_QA_retain
  - override /eval: tofu

model:
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-3.2-1B-Instruct_full

forget_split: forget01
retain_split: retain99
holdout_split: holdout01
retain_logs_path: null
question_key: "question"

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

trainer:
  method_args:
    lora_r: 8
    lora_alpha: 16
    T: 2
    K: 1
    eta_theta: 5.0e-5
    eta_in: 2.0e-4
    epsilon_multiplier: 0.85
    forget_loss_type: clamped_entropy
    gradient_accumulation_steps: 1
    conv_patience: 8
  args:
    per_device_train_batch_size: 2
    num_train_epochs: 1
    gradient_checkpointing: true
    seed: 42
    do_eval: false

task_name: blade_tofu01_smoke
paths:
  output_dir: workspace/saves/unlearn/${task_name}
