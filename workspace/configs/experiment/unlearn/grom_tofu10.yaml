# @package _global_
# GROM TOFU-10%  Llama-3.2-1B-Instruct  layers 11-15
# 官方基座是 1B，与 BLADE 3B 矩阵不对齐，备注列写明。

defaults:
  - override /model: Llama-3.2-1B-Instruct
  - override /trainer: GROM
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: TOFU_QA_retain
  - override /eval: tofu

model:
  model_args:
    pretrained_model_name_or_path: open-unlearning/tofu_Llama-3.2-1B-Instruct_full

forget_split: forget10
retain_split: retain90
holdout_split: holdout10
retain_logs_path: null
question_key: "question"

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

trainer:
  method_args:
    name: tofu10
    kind: tofu
    template: llama3
    forget_split: forget10
    retain_splits:
      - retain90
      - real_authors_perturbed
      - world_facts_perturbed
    layers: [11, 12, 13, 14, 15]
    target: suppress
    strength: 65
    w_r: 100
    rho: 0.03
    grom_seed: 0
  args:
    seed: 0
    do_eval: false

task_name: grom_tofu10
paths:
  output_dir: workspace/saves/unlearn/${task_name}
