defaults:
  - GradDiff

handler: ALTER
method_args:
  lora_r: 8
  n_forget_experts: 2
  tsallis_q: 1.5
  high_entropy_cut: 1.2
  tau_high: 0.8
  tau_low: 0.01
  top_k: 3
  target_modules:
    - q_proj
    - v_proj
  beta: 1.0
  gamma: 1.0
  lambda_entropy: 0.01
  eta_a: 1.0e-5
  eta_b: 1.0e-3
  reconstruction_note: paper-appendix-missing

args:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  num_train_epochs: 3
  learning_rate: 1.0e-3
  eval_strategy: 'no'
  do_eval: false
  eval_on_start: false
