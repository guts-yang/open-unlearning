defaults:
  - finetune

handler: GROM
method_args:
  name: grom
  kind: tofu
  template: llama3
  forget_split: forget10
  retain_splits:
    - retain90
    - real_authors_perturbed
    - world_facts_perturbed
  forget_jsonl: ""
  retain_jsonl: ""
  n_docs: 2000
  win: 400
  layers:
    - 11
    - 12
    - 13
    - 14
    - 15
  target: suppress
  strength: 65
  w_r: 100
  rho: 0.03
  forget_cols: 20000
  retain_cols: 40000
  batch_size: 16
  grom_seed: 0

args:
  per_device_train_batch_size: 1
  num_train_epochs: 1
  do_train: true
  do_eval: false
  eval_on_start: false
  eval_strategy: 'no'
  save_strategy: 'no'
  seed: 0
  bf16: true
  report_to: none
